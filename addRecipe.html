<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Recipe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-light d-flex flex-column justify-content-center align-items-center vh-100">

    <a href="./index.html" class="position-absolute top-0 start-0 m-3 text-light text-decoration-none">Back</a>


    <h2 class="text-center mb-4">Add New Recipe</h2>
    <div class="card shadow-lg p-4 bg-dark text-light" style="width: 400px; border-radius: 15px;">
        
        <form id="form">
            <div class="mb-3">
                <label for="id" class="form-label">Recipe ID</label>
                <input type="number" id="id" class="form-control" placeholder="Enter recipe ID">
            </div>

            <div class="mb-3">
                <label for="title" class="form-label">Recipe Title</label>
                <input type="text" id="recipe" class="form-control" placeholder="Enter recipe title">
            </div>

            <div class="mb-3">
                <label for="body" class="form-label">Procedure</label>
                <textarea id="procedure" class="form-control" rows="4" placeholder="Enter cooking steps"></textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100">Add Recipe</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="addRecipe.js"></script>
</body>

</html>
