<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Recipe</title>

  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light text-dark">

  
  <nav class="navbar navbar-expand-lg border-bottom" data-bs-theme="light">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">RecipeFinder ✨</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
        aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
        <div class="navbar-nav ms-auto">
          <a class="nav-link" href="index.html">Categories</a>
          <a class="nav-link" href="#">About Us</a>
          <a class="nav-link" href="#">Contact Us</a>
        </div>
      </div>
    </div>
  </nav>

 
  <div class="container d-flex flex-column align-items-center justify-content-center py-5">
    <h2 class="text-center mb-4">Add New Recipe</h2>
    <div class="card shadow-lg p-4" style="width: 400px; border-radius: 20px;">
      <form id="form">
        <div class="mb-3">
          <label for="id" class="form-label">Recipe ID</label>
          <input type="number" id="id" class="form-control" placeholder="Enter recipe ID">
        </div>

        <div class="mb-3">
          <label for="title" class="form-label">Recipe Title</label>
          <input type="text" id="recipe" class="form-control" placeholder="Enter recipe title">
        </div>

        <div class="mb-3">
          <label for="procedure" class="form-label">Procedure</label>
          <textarea id="procedure" class="form-control" rows="4" placeholder="Enter cooking steps"></textarea>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn primary-cta flex-fill">Add Recipe</button>
          <a href="index.html" class="btn ghost-cta flex-fill">Cancel</a>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="addRecipe.js"></script>
</body>

</html>
