<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recipes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg border-bottom" data-bs-theme="light">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">RecipeFinder ✨</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
        <ul class="navbar-nav ms-auto align-items-center">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="categoriesDropdown" role="button" data-bs-toggle="dropdown">Categories</a>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="categoriesDropdown">
              <li><a class="dropdown-item" href="#" id="filter-all">All</a></li>
              <li><a class="dropdown-item" href="#" id="filter-veg">Veg</a></li>
              <li><a class="dropdown-item" href="#" id="filter-nonveg">Non-Veg</a></li>
            </ul>
          </li>
          <li class="nav-item"><a class="nav-link" href="#">About Us</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Contact Us</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="m-0">All Recipes</h2>
      <a id="backBtn" href="index.html" class="btn ghost-cta">Back</a>
    </div>

    <div id="alertsContainer"></div>
    <div id="table-container"></div>

    <div class="mt-4 d-flex justify-content-center gap-3">
      <button id="add-under-table" class="btn primary-cta">Add Recipe</button>
      <button id="open-delete-modal" class="btn ghost-cta">Delete Recipe</button>
    </div>
  </div>

  <div class="modal fade" id="addRecipeModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <form id="addRecipeForm" class="modal-content" novalidate>
        <div class="modal-header">
          <h5 class="modal-title">Add New Recipe</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="modalAlert"></div>
          <div class="mb-3">
            <label for="recipeId" class="form-label">ID</label>
            <input type="text" id="recipeId" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="recipeTitle" class="form-label">Title</label>
            <input type="text" id="recipeTitle" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="recipeProcedure" class="form-label">Procedure</label>
            <textarea id="recipeProcedure" class="form-control" rows="3" required></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn primary-cta">Add Recipe</button>
          <button type="button" class="btn ghost-cta" data-bs-dismiss="modal">Close</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal fade" id="deleteRecipeModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <form id="deleteRecipeForm" class="modal-content" novalidate>
        <div class="modal-header">
          <h5 class="modal-title">Delete Recipe</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="deleteModalAlert"></div>
          <div class="mb-3">
            <label for="deleteRecipeId" class="form-label">Recipe ID</label>
            <input type="text" id="deleteRecipeId" class="form-control" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn primary-cta">Delete</button>
          <button type="button" class="btn ghost-cta" data-bs-dismiss="modal">Close</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal fade" id="recipeModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="recipeModalLabel">Recipe</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="recipeModalBody"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="recipes.js"></script>
  <script src="addRecipe.js"></script>
  <script>
    document.getElementById('add-under-table')?.addEventListener('click', () => {
      const el = document.getElementById('addRecipeModal');
      new bootstrap.Modal(el, { backdrop: false }).show();
    });
    document.getElementById('open-delete-modal')?.addEventListener('click', () => {
      const el = document.getElementById('deleteRecipeModal');
      new bootstrap.Modal(el, { backdrop: false }).show();
    });
  </script>
</body>
</html>
